<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fantasy Intel">
<title>Fantasy Intel</title>
<style>
:root{--bg:#080c16;--panel:#111827;--panel2:#182235;--line:#263249;--text:#f5f7fb;--muted:#9ca9bd;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--blue:#3b82f6;--purple:#a855f7;--cyan:#06b6d4}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:linear-gradient(180deg,#0b1020 0,#080c16 38%,#080c16 100%);color:var(--text);font:15px/1.42 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;padding-bottom:92px}.wrap{max-width:780px;margin:auto;padding:0 14px}header{position:sticky;top:0;z-index:10;background:rgba(8,12,22,.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 0 10px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand h1{font-size:22px;margin:0}.brand div{font-size:12px;color:var(--muted)}.live{font-size:11px;font-weight:800;padding:6px 9px;border-radius:999px;background:#10341f;color:#8bf7ab;border:1px solid #1e6738}.controls{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.search{width:100%;border:1px solid var(--line);background:#0e1626;color:var(--text);padding:12px 13px;border-radius:12px;font-size:16px;outline:none}.refresh{border:1px solid var(--line);background:#172033;color:#fff;border-radius:12px;padding:0 14px;font-weight:800}.chips{display:flex;gap:7px;overflow:auto;padding:10px 0 2px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#101827;color:#cbd5e1;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.chip.active{background:#e5e7eb;color:#111827;border-color:#e5e7eb}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:10px}.stat b{display:block;font-size:19px}.stat span{font-size:11px;color:var(--muted)}#status{color:var(--muted);font-size:12px;margin:8px 2px 12px}.card{background:linear-gradient(180deg,#121b2c,#0f1726);border:1px solid var(--line);border-radius:16px;margin:10px 0;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.18)}.card.critical{border-color:#8b2635}.card.high{border-color:#5e4a1d}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:10px;letter-spacing:.35px;font-weight:900;padding:5px 7px;border-radius:7px;background:#253149}.tag.upgrade,.tag.add,.tag.start{background:#123d25;color:#87f2a8}.tag.downgrade,.tag.avoid,.tag.drop,.tag.sit{background:#491a24;color:#ff9ca9}.tag.monitor{background:#4a3511;color:#ffd36a}.tag.handcuff{background:#16394a;color:#7cdbff}.tag.stack{background:#3a2051;color:#d8a8ff}.priority{font-size:10px;font-weight:900;color:var(--muted)}.name{font-size:21px;font-weight:900;margin:10px 0 1px}.meta{color:#9db0ca;font-size:12px;font-weight:700}.headline{font-size:15px;font-weight:900;margin:11px 0 5px}.copy{color:#c8d2e0;margin:0 0 8px}.rec{background:#0b1321;border-left:3px solid var(--blue);border-radius:6px;padding:9px 10px;margin:10px 0}.rec b{font-size:11px;color:#93c5fd;display:block;margin-bottom:3px}.details{font-size:12px;color:var(--muted);border-top:1px solid #202b3d;margin-top:11px;padding-top:9px}.buttons{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin-top:12px}.btn{border:1px solid var(--line);background:#172134;color:#dce5f1;border-radius:10px;padding:10px 8px;font-weight:850}.btn.on{background:#e5e7eb;color:#111827}.btn.note{width:44px}.source{display:inline-block;margin-top:9px;color:#84b7ff;font-size:12px;text-decoration:none}.empty{text-align:center;padding:70px 18px;color:var(--muted)}nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(10,15,27,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom))}.navin{max-width:780px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}.navbtn{border:0;background:transparent;color:#8795aa;font-size:10px;font-weight:850;padding:8px 1px;border-radius:10px}.navbtn span{display:block;font-size:18px;line-height:20px}.navbtn.active{color:#fff;background:#192338}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#e5e7eb;color:#111827;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:900;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}.noteBox{margin-top:8px;background:#0c1423;border:1px solid var(--line);border-radius:10px;padding:9px;color:#ccd7e7;font-size:12px}.hidden{display:none!important}
@media(min-width:650px){.wrap{padding:0 20px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{margin:0}.summary{grid-template-columns:repeat(3,160px)}}
</style>
</head>
<body>
<header><div class="wrap"><div class="top"><div class="brand"><h1>Fantasy Intel</h1><div>2026 draft + season command board</div></div><div class="live" id="liveBadge">LIVE DATA</div></div><div class="controls"><input id="search" class="search" placeholder="Search player, team, note…"><button class="refresh" id="refresh">↻</button></div><div class="chips" id="chips"></div></div></header>
<main class="wrap"><div class="summary"><div class="stat"><b id="total">—</b><span>ACTIVE INTEL</span></div><div class="stat"><b id="flagCount">—</b><span>FLAGGED</span></div><div class="stat"><b id="highCount">—</b><span>HIGH / CRITICAL</span></div></div><div id="status">Loading current board…</div><div class="cards" id="cards"></div></main>
<nav><div class="navin"><button class="navbtn active" data-view="INTEL"><span>⌂</span>INTEL</button><button class="navbtn" data-view="FLAGGED"><span>⚑</span>FLAGGED</button><button class="navbtn" data-view="SAVED"><span>★</span>SAVED</button><button class="navbtn" data-view="HANDCUFF"><span>↔</span>HANDCUFFS</button><button class="navbtn" data-view="STACK"><span>⇅</span>STACKS</button></div></nav>
<div class="toast" id="toast"></div>
<script>
const SUPABASE='https://bbodmhffnqebhfksjier.supabase.co';
const KEY='sb_publishable_L048cgw2gZwCeWmSWpUclA_cuKCSyQn';
const headers={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const actionOrder=['ALL','UPGRADE','DOWNGRADE','ADD','START','SIT','AVOID','MONITOR','HANDCUFF','STACK'];
let items=[], view='INTEL', action='ALL', query='';
const $=id=>document.getElementById(id);
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fmt(d){if(!d)return '—';const x=new Date(d+'T12:00:00');return x.toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'})}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1200)}
async function load(){
 $('status').textContent='Refreshing live board…';
 try{const r=await fetch(SUPABASE+'/rest/v1/fantasy_intel?select=*&status=neq.RESOLVED&order=last_confirmed_date.desc,updated_at.desc',{headers});if(!r.ok)throw new Error(await r.text());items=await r.json();$('liveBadge').textContent='LIVE DATA';render();$('status').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+' • flags and saves sync through the board';}
 catch(e){$('liveBadge').textContent='CONNECTION ISSUE';$('status').textContent='Could not load the board. Tap refresh.';console.error(e)}
}
function filters(){const present=new Set(items.map(x=>x.action));$('chips').innerHTML=actionOrder.filter(x=>x==='ALL'||present.has(x)).map(x=>`<button class="chip ${action===x?'active':''}" data-action="${x}">${x}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{action=b.dataset.action;filters();render()})}
function visible(){return items.filter(x=>{
 if(view==='FLAGGED'&&!x.is_flagged)return false;if(view==='SAVED'&&!x.is_saved)return false;if(view==='HANDCUFF'&&x.action!=='HANDCUFF')return false;if(view==='STACK'&&x.action!=='STACK')return false;if(action!=='ALL'&&x.action!==action)return false;
 if(query){const hay=[x.player_name,x.team,x.position,x.headline,x.what_changed,x.recommendation,x.related_players,x.user_note].join(' ').toLowerCase();if(!hay.includes(query))return false}return true;
})}
function render(){filters();$('total').textContent=items.length;$('flagCount').textContent=items.filter(x=>x.is_flagged).length;$('highCount').textContent=items.filter(x=>['HIGH','CRITICAL'].includes(x.priority)).length;const list=visible();$('cards').innerHTML=list.length?list.map(card).join(''):`<div class="empty"><b>Nothing in this view yet.</b><br>New intel will appear here automatically.</div>`;bindCards()}
function card(x){const note=x.user_note?`<div class="noteBox"><b>Your note:</b> ${esc(x.user_note)}</div>`:'';return `<article class="card ${x.priority.toLowerCase()}"><div class="row"><div class="tags"><span class="tag ${x.action.toLowerCase()}">${esc(x.action)}</span><span class="tag">${esc(x.status)}</span></div><div class="priority">${esc(x.priority)}</div></div><div class="name">${esc(x.player_name)}</div><div class="meta">${esc(x.position||'')} • ${esc(x.team||'')}</div><div class="headline">${esc(x.headline||x.what_changed)}</div><p class="copy">${esc(x.what_changed)}</p><div class="rec"><b>WHAT TO DO</b>${esc(x.recommendation)}</div>${x.related_players?`<div class="details"><b>Related:</b> ${esc(x.related_players)}<br><b>Next trigger:</b> ${esc(x.next_trigger||'—')}<br><b>First reported:</b> ${fmt(x.first_reported_date)} &nbsp; <b>Confirmed:</b> ${fmt(x.last_confirmed_date)}</div>`:''}${note}<div class="buttons"><button class="btn flag ${x.is_flagged?'on':''}" data-id="${x.id}">⚑ ${x.is_flagged?'FLAGGED':'FLAG'}</button><button class="btn save ${x.is_saved?'on':''}" data-id="${x.id}">★ ${x.is_saved?'SAVED':'SAVE'}</button><button class="btn note" data-id="${x.id}">✎</button></div>${x.source_url?`<a class="source" href="${esc(x.source_url)}" target="_blank" rel="noopener">Source: ${esc(x.source_title||'open')}</a>`:''}</article>`}
function bindCards(){document.querySelectorAll('.flag').forEach(b=>b.onclick=()=>toggle(b.dataset.id,'is_flagged'));document.querySelectorAll('.save').forEach(b=>b.onclick=()=>toggle(b.dataset.id,'is_saved'));document.querySelectorAll('.note').forEach(b=>b.onclick=()=>note(b.dataset.id))}
async function patch(id,payload){const r=await fetch(SUPABASE+'/rest/v1/fantasy_intel?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{...headers,Prefer:'return=representation'},body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());return r.json()}
async function toggle(id,key){const x=items.find(i=>i.id===id),next=!x[key];x[key]=next;render();try{await patch(id,{[key]:next});toast(next?(key==='is_flagged'?'Flagged':'Saved'):(key==='is_flagged'?'Flag removed':'Save removed'))}catch(e){x[key]=!next;render();toast('Could not save');console.error(e)}}
async function note(id){const x=items.find(i=>i.id===id);const n=prompt('Your note for '+x.player_name+':',x.user_note||'');if(n===null)return;x.user_note=n.trim()||null;render();try{await patch(id,{user_note:x.user_note});toast('Note saved')}catch(e){toast('Could not save note')}}
$('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});$('refresh').onclick=load;document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.navbtn').forEach(n=>n.classList.toggle('active',n===b));window.scrollTo({top:0,behavior:'smooth'});render()});
load();setInterval(load,300000);
</script>
</body>
</html>
