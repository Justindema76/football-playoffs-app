<title>2026 Fantasy Intel</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--line:#d9e1ec;--text:#111827;--muted:#6b7280;--blue:#1d4ed8;--green:#15803d;--purple:#7c3aed;--orange:#ea580c;--pink:#db2777;--slate:#475569;--cyan:#0891b2;--red:#dc2626;--teal:#0f766e}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{padding-bottom:70px}.app{width:100%;max-width:1180px;margin:0 auto;padding:8px 12px 80px}body[data-view="draft"] .app{max-width:none;padding-left:10px;padding-right:10px}.topbar{position:sticky;top:0;z-index:50;background:rgba(244,247,251,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:7px 0 8px}.topline{display:grid;grid-template-columns:auto minmax(300px,1fr) auto;gap:12px;align-items:center}.brand h1{font-size:24px;line-height:1;margin:0;letter-spacing:-.035em}.brand .sub{font-size:11px;color:var(--muted);margin-top:4px}.search{width:100%;border:1px solid var(--line);background:white;border-radius:11px;padding:10px 12px;font-size:15px;outline:none}.statuspill{display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid #cfe8d6;border-radius:999px;background:#f5fff7;color:#147a36;font-size:11px;font-weight:900;white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:#22c55e}.stats{display:grid;grid-template-columns:repeat(4,minmax(95px,1fr));gap:7px;margin-top:7px}.stat{background:#fff;border:1px solid var(--line);border-radius:11px;text-align:center;padding:6px 8px}.stat b{font-size:16px;display:block}.stat span{font-size:8px;color:var(--muted);font-weight:900;letter-spacing:.08em}.viewhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 2px 7px}.viewhead h2{font-size:12px;letter-spacing:.12em;margin:0}.viewhead .muted{font-size:11px;color:var(--muted)}.filters{display:flex;gap:6px;overflow:auto;scrollbar-width:none}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900;color:#506078;white-space:nowrap}.chip.on{background:#111827;color:#fff;border-color:#111827}.pos{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:25px;padding:0 10px;border-radius:7px;color:#fff;font-size:11px;font-weight:950;letter-spacing:.06em}.pos.QB{background:var(--purple)}.pos.RB{background:var(--green)}.pos.WR{background:var(--blue)}.pos.TE{background:var(--orange)}.pos.DEF{background:var(--slate)}.pos.K{background:var(--pink)}.pos.X{background:#64748b}.positionLegend{display:flex;gap:7px;flex-wrap:wrap;margin:3px 0 9px}.draft-summary{display:grid;grid-template-columns:repeat(4,minmax(100px,1fr));gap:7px;margin-bottom:9px}.dsum{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}.dsum strong{font-size:15px}.dsum span{font-size:9px;color:var(--muted);font-weight:900}.tierGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:start;padding-bottom:10px}.tierBox{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}.tierHead{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:#eaf0f8;border-bottom:1px solid var(--line)}.tierHead strong{font-size:12px;letter-spacing:.06em}.tierHead span{font-size:9px;color:#64748b;font-weight:800}.draftRow{display:grid;grid-template-columns:34px 52px minmax(0,1fr) auto;gap:7px;align-items:center;padding:7px 8px;border-bottom:1px solid #e8edf4;position:relative}.draftRow:last-child{border-bottom:0}.draftRow.QB{border-left:5px solid var(--purple)}.draftRow.RB{border-left:5px solid var(--green)}.draftRow.WR{border-left:5px solid var(--blue)}.draftRow.TE{border-left:5px solid var(--orange)}.draftRow.DEF{border-left:5px solid var(--slate)}.draftRow.K{border-left:5px solid var(--pink)}.rno{font-weight:950;font-size:15px;color:#44546b;text-align:center}.playerName{font-size:13px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pmeta{font-size:9px;color:#6b7280;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pmeta b{color:#334155}.tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}.tag{font-size:8px;font-weight:950;padding:3px 5px;border-radius:5px;background:#edf2f7;color:#435169;letter-spacing:.025em}.tag.target{background:#dcfce7;color:#166534}.tag.cowbell{background:#cffafe;color:#155e75}.tag.stack{background:#dbeafe;color:#1e40af}.tag.injury{background:#fee2e2;color:#991b1b}.tag.monitor{background:#ede9fe;color:#5b21b6}.tag.handcuff{background:#e0e7ff;color:#3730a3}.tag.workhorse{background:#ccfbf1;color:#115e59}.tag.upgrade{background:#dcfce7;color:#166534}.tag.downgrade,.tag.avoid{background:#fee2e2;color:#991b1b}.ready{font-size:8px;font-weight:950;padding:4px 6px;border-radius:999px;background:#eef2f7;color:#59677c;white-space:nowrap}.intelLine{font-size:9px;color:#4b5563;margin-top:3px;line-height:1.25}.cardGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.listStack{display:grid;grid-template-columns:1fr;gap:8px;max-width:980px;margin:0 auto}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.listStack .card{padding:12px 14px}.listStack .cardName{font-size:16px}.listStack .cardText,.listStack .cardRec{font-size:11px}.cardTop{display:flex;justify-content:space-between;gap:8px;align-items:center}.cardName{font-size:15px;font-weight:950;margin-top:7px}.cardMeta{font-size:10px;color:var(--muted);margin-top:2px}.cardText{font-size:11px;line-height:1.35;color:#425066;margin-top:7px}.cardRec{margin-top:7px;padding:7px 8px;border-left:3px solid var(--blue);background:#f5f8fd;font-size:10px;line-height:1.35}.rankbadge{font-size:11px;font-weight:950;color:#475569}.empty{padding:50px;text-align:center;color:var(--muted)}.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;border-top:1px solid var(--line);background:rgba(248,250,252,.98);backdrop-filter:blur(16px);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}.navin{width:100%;max-width:none;margin:auto;display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.nav button{border:0;background:transparent;color:#64748b;border-radius:9px;padding:8px 4px;font-size:9px;font-weight:950}.nav button.on{background:#1d4ed8;color:#fff}@media(min-width:1500px){body[data-view="players"] .cardGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:1300px){.tierGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:1050px){.tierGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.cardGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.topline{grid-template-columns:1fr auto}.search{grid-column:1/-1}.stats{grid-template-columns:repeat(4,1fr)}}@media(max-width:700px){.app{width:100%;padding:8px 8px 80px}.brand h1{font-size:20px}.topline{grid-template-columns:1fr auto}.stats{grid-template-columns:repeat(4,1fr)}.stat{padding:5px 3px}.stat b{font-size:14px}.cardGrid{grid-template-columns:1fr}.listStack{max-width:none}.tierGrid{grid-template-columns:1fr}.tierBox{min-width:0}.draftRow{grid-template-columns:30px 50px minmax(0,1fr) auto;padding:7px 6px}.navin{grid-template-columns:repeat(7,1fr)}.nav button{font-size:7px;padding:8px 1px}.positionLegend{display:none}.draft-summary{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="app"><header class="topbar"><div class="topline"><div class="brand"><h1>2026 Fantasy Intel</h1><div class="sub">Yahoo ranking order + live draft intelligence</div></div><input id="search" class="search" placeholder="Search player, team, action..."><div class="statuspill"><span class="dot"></span><span id="sync">SYNCED</span></div></div><div class="stats"><div class="stat"><b id="intelCount">—</b><span>INTEL</span></div><div class="stat"><b id="highCount">—</b><span>HIGH+</span></div><div class="stat"><b id="flagCount">—</b><span>FLAGGED</span></div><div class="stat"><b id="targetCount">—</b><span>PLAN PLAYERS</span></div></div></header><div class="viewhead"><div><h2 id="viewTitle">DRAFT</h2><div class="positionLegend"><span class="pos QB">QB</span><span class="pos RB">RB</span><span class="pos WR">WR</span><span class="pos TE">TE</span><span class="pos DEF">DEF</span><span class="pos K">K</span></div></div><div class="muted" id="viewMeta"></div></div><div class="filters" id="filters"></div><main id="content"></main></div><nav class="nav"><div class="navin"><button data-view="intel">INTEL</button><button data-view="players">PLAYERS</button><button data-view="targets">TARGETS</button><button data-view="cowbell">COWBELL</button><button data-view="injuries">INJURIES</button><button data-view="weather">WEATHER</button><button data-view="draft" class="on">DRAFT</button></div></nav><script>const SB='https://bbodmhffnqebhfksjier.supabase.co';const KEY='sb_publishable_L048cgw2gZwCeWmSWpUclA_cuKCSyQn';const H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};let feed=[],intel=[],weather=[],plan=[],owner=[],view='draft',position='ALL',q='';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const posClass=p=>['QB','RB','WR','TE','DEF','K'].includes(String(p||'').toUpperCase())?String(p).toUpperCase():'X';function tagsOf(p){return [...new Set([...(p.intel_tags||[]),...(p.tags||[]),p.user_target?'TARGET':null,p.intel_action].filter(Boolean).map(x=>String(x).toUpperCase()))]}function tagClass(t){const x=String(t).toLowerCase();for(const k of ['target','cowbell','stack','injury','monitor','handcuff','workhorse','upgrade','downgrade','avoid'])if(x.includes(k))return k;return''}function tierOf(r){return r?Math.ceil(Number(r)/12):null}function queryMatch(obj){if(!q)return true;return Object.values(obj||{}).join(' ').toLowerCase().includes(q)}async function get(path){const r=await fetch(SB+'/rest/v1/'+path,{headers:H});if(!r.ok)throw Error(await r.text());return r.json()}async function load(){$('sync').textContent='SYNCING';try{const[f,i,w,p,o]=await Promise.all([get('yahoo_canonical_player_feed?select=*&order=yahoo_rank.asc.nullslast,yahoo_name.asc'),get('intel_items?select=*&status=neq.RESOLVED&order=priority.asc,updated_at.desc'),get('weather_watch?select=*&order=game_time.asc.nullslast'),get('draft_command_plan?select=targets,version,league_size,roster_spots&id=eq.1'),get('intel_owner_state?select=*')]);feed=f;intel=i;weather=w;plan=(p[0]?.targets||[]).slice().sort((a,b)=>(+a.yahoo_rank||9999)-(+b.yahoo_rank||9999));owner=o;$('sync').textContent='SYNCED';render()}catch(e){$('sync').textContent='ERROR';$('content').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}function activeIntelFor(name){const n=String(name||'').toLowerCase();return intel.filter(x=>String(x.player_name||'').toLowerCase()===n)}function updateStats(){$('intelCount').textContent=intel.length;$('highCount').textContent=intel.filter(x=>['HIGH','CRITICAL'].includes(x.priority)).length;$('flagCount').textContent=owner.filter(x=>x.is_flagged).length;$('targetCount').textContent=plan.length}function buildFilters(){const opts=view==='draft'||view==='players'||view==='targets'||view==='cowbell'||view==='injuries'?['ALL','QB','RB','WR','TE','DEF','K']:['ALL'];$('filters').innerHTML=opts.map(x=>`<button class="chip ${position===x?'on':''}" data-pos="${x}">${x}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{position=b.dataset.pos;buildFilters();renderBody()})}function render(){updateStats();buildFilters();renderBody()}function renderBody(){document.body.dataset.view=view;$('viewTitle').textContent=view.toUpperCase();if(view==='draft')return renderDraft();if(view==='players')return renderPlayers(false);if(view==='targets')return renderPlayers(true);if(view==='cowbell')return renderTagged('COWBELL');if(view==='injuries')return renderInjuries();if(view==='weather')return renderWeather();return renderIntel()}function renderDraft(){let rows=plan.filter(p=>(position==='ALL'||String(p.pos||p.position).toUpperCase()===position)&&queryMatch(p));const tiers=new Map();rows.forEach(p=>{const t=tierOf(p.yahoo_rank)||99;if(!tiers.has(t))tiers.set(t,[]);tiers.get(t).push(p)});$('viewMeta').textContent=rows.length+' plan players • strict Yahoo order';const boxes=[...tiers.entries()].sort((a,b)=>a[0]-b[0]).map(([t,ps])=>{const lo=(t-1)*12+1,hi=t*12;return `<section class="tierBox"><div class="tierHead"><strong>TIER ${t}</strong><span>Yahoo ${lo}-${hi} · ${ps.length}</span></div>${ps.map(draftRow).join('')}</section>`}).join('');$('content').innerHTML=`<div class="draft-summary"><div class="dsum"><span>STATUS</span><strong>PRE</strong></div><div class="dsum"><span>PLAN</span><strong>${plan.length}</strong></div><div class="dsum"><span>LEAGUE</span><strong>12</strong></div><div class="dsum"><span>ORDER</span><strong>YAHOO</strong></div></div><div class="tierGrid">${boxes||'<div class="empty">No players match.</div>'}</div>`}function draftRow(p){const pc=posClass(p.pos||p.position),ai=activeIntelFor(p.name||p.yahoo_canonical_name||'')[0];const ts=[...(p.tags||[]),...(ai?.draft_tags||[]),ai?.action].filter(Boolean);const intelText=ai?.recommendation||'';return `<div class="draftRow ${pc}"><div class="rno">${esc(p.yahoo_rank??'—')}</div><span class="pos ${pc}">${pc}</span><div><div class="playerName">${esc(p.yahoo_canonical_name||p.name)}</div><div class="pmeta"><b>${esc(p.team||'')}</b> · Yahoo #${esc(p.yahoo_rank??'—')}</div>${ts.length?`<div class="tags">${[...new Set(ts)].slice(0,5).map(t=>`<span class="tag ${tagClass(t)}">${esc(t)}</span>`).join('')}</div>`:''}${intelText?`<div class="intelLine">${esc(intelText)}</div>`:''}</div><span class="ready">READY</span></div>`}function renderPlayers(targetOnly){let rows=feed.filter(p=>(!targetOnly||p.user_target)&&(position==='ALL'||p.position===position)&&queryMatch(p));$('viewMeta').textContent=rows.length+' players';$('content').innerHTML=`<div class="${targetOnly?'listStack':'cardGrid'}">${rows.map(playerCard).join('')||'<div class="empty">No players match.</div>'}</div>`}function playerCard(p){const pc=posClass(p.position),ts=tagsOf(p);return `<article class="card"><div class="cardTop"><span class="pos ${pc}">${pc}</span><span class="rankbadge">Yahoo #${esc(p.yahoo_rank??'—')}</span></div><div class="cardName">${esc(p.yahoo_name)}</div><div class="cardMeta">${esc(p.team||'')} · Tier ${esc(tierOf(p.yahoo_rank)||'—')}</div>${ts.length?`<div class="tags">${ts.slice(0,6).map(t=>`<span class="tag ${tagClass(t)}">${esc(t)}</span>`).join('')}</div>`:''}${p.intel_recommendation?`<div class="cardRec">${esc(p.intel_recommendation)}</div>`:''}</article>`}function renderTagged(tag){let rows=feed.filter(p=>tagsOf(p).some(t=>t.includes(tag))&&(position==='ALL'||p.position===position)&&queryMatch(p));$('viewMeta').textContent=rows.length+' '+tag.toLowerCase()+' players';$('content').innerHTML=`<div class="listStack">${rows.map(playerCard).join('')||'<div class="empty">No players tagged '+tag+'.</div>'}</div>`}function renderInjuries(){let rows=feed.filter(p=>(tagsOf(p).some(t=>t.includes('INJUR')||t.includes('MONITOR'))||/injur|practice|pup|ir/i.test((p.intel_what_changed||'')+' '+(p.intel_recommendation||'')))&&(position==='ALL'||p.position===position)&&queryMatch(p));$('viewMeta').textContent=rows.length+' injury watches';$('content').innerHTML=`<div class="listStack">${rows.map(playerCard).join('')||'<div class="empty">No injury watches.</div>'}</div>`}function renderIntel(){let rows=intel.filter(x=>queryMatch(x));$('viewMeta').textContent=rows.length+' active intel items';$('content').innerHTML=`<div class="listStack">${rows.map(x=>{const pc=posClass(x.position);return `<article class="card"><div class="cardTop"><span class="pos ${pc}">${pc}</span><span class="tag ${tagClass(x.action)}">${esc(x.action)}</span></div><div class="cardName">${esc(x.player_name)}</div><div class="cardMeta">${esc(x.team||'')} · ${esc(x.priority)}</div><div class="cardText">${esc(x.what_changed)}</div><div class="cardRec"><b>WHAT TO DO</b><br>${esc(x.recommendation)}</div></article>`}).join('')||'<div class="empty">No intel.</div>'}</div>`}function renderWeather(){let rows=weather.filter(x=>queryMatch(x));$('viewMeta').textContent=rows.length+' watched games';$('content').innerHTML=`<div class="listStack">${rows.map(x=>`<article class="card"><div class="cardName">${esc(x.away_team)} @ ${esc(x.home_team)}</div><div class="cardMeta">${esc(x.venue||'')} · ${esc(x.condition||'')}</div><div class="cardText">Wind ${esc(x.wind_mph??'—')} mph · Temp ${esc(x.temperature_f??'—')}°F · Precip ${esc(x.precipitation_pct??'—')}%</div><div class="cardRec">${esc(x.fantasy_impact||'No material weather impact yet.')}</div></article>`).join('')||'<div class="empty">No material weather items yet.</div>'}</div>`}document.getElementById('search').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();renderBody()});document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;position='ALL';document.querySelectorAll('.nav button').forEach(n=>n.classList.toggle('on',n===b));buildFilters();renderBody();window.scrollTo({top:0,behavior:'smooth'})});load();setInterval(load,60000);</script></body></html>
