<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><title>2026 Fantasy Intel</title><style>:root{--bg:#f5f7fb;--card:#fff;--line:#d8e0ea;--text:#111c31;--muted:#6e7c90;--blue:#234aa5;--green:#14833b;--amber:#b66b00;--red:#a91f1f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.app{max-width:900px;margin:auto;padding:0 14px 100px}.head{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.96);backdrop-filter:blur(16px);padding:calc(12px + env(safe-area-inset-top)) 0 9px}.title{display:flex;justify-content:space-between;gap:12px;align-items:center}.title h1{font-size:26px;margin:0;letter-spacing:-.04em}.sync{font-size:11px;color:var(--muted);text-align:right}.sync b{color:var(--green)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:9px;color:var(--muted);font-weight:900}.search{display:flex;gap:8px;margin-top:11px}.search input{flex:1;background:#fff;border:1px solid var(--line);border-radius:15px;color:var(--text);padding:13px;font-size:16px}.tokenBtn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:15px;padding:0 13px;font-weight:900}.chips{display:flex;gap:7px;overflow:auto;padding:10px 0 2px;scrollbar-width:none}.chip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:8px 11px;white-space:nowrap;font-size:11px;font-weight:900}.chip.on{background:var(--text);color:#fff}.status{margin:15px 3px 8px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:800}.cards{display:grid;gap:9px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.row{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:13px}.rank{text-align:center;font-size:20px;font-weight:950}.rank small{display:block;font-size:8px;color:var(--muted);letter-spacing:.1em}.name{font-size:18px;font-weight:950}.meta{font-size:12px;color:var(--muted);margin-top:3px}.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.badge{font-size:9px;font-weight:900;padding:5px 7px;border-radius:999px;background:#e8eef6;color:#34445c}.badge.target,.badge.upgrade{background:#dff5e5;color:#17632f}.badge.cowbell{background:#fff0cc;color:#7b4a00}.badge.handcuff{background:#eee7ff;color:#5c36a3}.badge.injury,.badge.avoid,.badge.drop{background:#ffe1e1;color:#8c1d1d}.star{width:44px;height:44px;border:1px solid var(--line);border-radius:14px;background:#fff;color:#9aa7b7;font-size:25px}.star.on{color:#d19a00;background:#fff7dc}.notes{border-top:1px solid var(--line);padding:10px 13px;font-size:12px;line-height:1.45;color:#44536a}.suggest{margin-top:7px;color:#6549a2}.verify{font-size:9px;color:var(--green);font-weight:900;margin-left:4px}.empty{text-align:center;color:var(--muted);padding:50px 10px}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(245,247,251,.97);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:30}.navin{max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav button{border:0;background:transparent;color:#6f7e92;padding:10px 2px;border-radius:12px;font-size:9px;font-weight:950}.nav button.on{background:var(--blue);color:#fff}.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:600px;margin:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}.sheet h3{margin:0 0 7px}.sheet p{font-size:12px;color:var(--muted)}.sheet input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1;border:0;border-radius:12px;padding:11px;font-weight:900}.primary{background:var(--blue);color:#fff}.secondary{background:#e8eef6;color:var(--text)}@media(min-width:720px){.cards{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><header class="head"><div class="title"><div><h1>2026 Fantasy Intel</h1><div class="sync">Strict Yahoo mirror + our intelligence</div></div><div class="sync"><b id="sync">SYNCING</b><br><span id="stamp">—</span></div></div><div class="stats"><div class="stat"><b id="total">—</b><span>YAHOO PLAYERS</span></div><div class="stat"><b id="targets">—</b><span>TARGETS</span></div><div class="stat"><b id="cowbells">—</b><span>COWBELLS</span></div><div class="stat"><b id="alerts">—</b><span>INTEL</span></div></div><div class="search"><input id="q" placeholder="Search exact Yahoo player or team…"><button class="tokenBtn" onclick="openToken()">KEY</button></div><div class="chips" id="positions"></div></header><div class="status"><span id="viewLabel">YAHOO PLAYERS</span><span id="count"></span></div><main class="cards" id="cards"></main><div class="empty" id="empty" hidden>No verified Yahoo players match this view.</div></div><nav class="nav"><div class="navin"><button class="on" data-view="players">PLAYERS</button><button data-view="targets">TARGETS</button><button data-view="cowbell">COWBELL</button><button data-view="injuries">INJURIES</button><button data-view="intel">INTEL</button></div></nav><div class="modal" id="modal"><div class="sheet"><h3>Draft board key</h3><p>Paste your existing Draft Planner connection key once to add or remove targets.</p><input id="token" type="password" placeholder="YLDA-…"><div class="actions"><button class="secondary" onclick="closeToken()">Cancel</button><button class="primary" onclick="saveToken()">Save</button></div></div></div><script>const SB='https://bbodmhffnqebhfksjier.supabase.co',KEY='sb_publishable_L048cgw2gZwCeWmSWpUclA_cuKCSyQn',H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};let all=[],view='players',pos='ALL';async function load(){try{sync.textContent='SYNCING';const r=await fetch(SB+'/rest/v1/yahoo_canonical_player_feed?select=*&order=yahoo_rank.asc.nullslast,yahoo_name.asc',{headers:H});if(!r.ok)throw Error(await r.text());all=await r.json();sync.textContent='LIVE';stamp.textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});buildPos();render()}catch(e){sync.textContent='ERROR';cards.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}function buildPos(){positions.innerHTML=['ALL','QB','RB','WR','TE','DEF','K'].map(x=>`<button class="chip ${x===pos?'on':''}" onclick="setPos('${x}')">${x}</button>`).join('')}function setPos(x){pos=x;buildPos();render()}function setView(x){view=x;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===x));render()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));q.oninput=render;function hasTag(p,t){return(p.intel_tags||[]).some(x=>String(x).toUpperCase().includes(t))}function matchView(p){if(view==='targets')return p.user_target;if(view==='cowbell')return hasTag(p,'COWBELL');if(view==='injuries')return hasTag(p,'INJUR')||/injur|practice|IR|PUP/i.test((p.intel_what_changed||'')+' '+(p.intel_recommendation||''));if(view==='intel')return!!p.intel_action||(p.suggestions||[]).length>0;return true}function tier(p){return p.yahoo_rank?Math.ceil(p.yahoo_rank/12):null}function render(){const s=q.value.trim().toLowerCase();const rows=all.filter(p=>matchView(p)&&(pos==='ALL'||p.position===pos)&&(!s||[p.yahoo_name,p.team,p.position].join(' ').toLowerCase().includes(s)));total.textContent=all.length;targets.textContent=all.filter(p=>p.user_target).length;cowbells.textContent=all.filter(p=>hasTag(p,'COWBELL')).length;alerts.textContent=all.filter(p=>p.intel_action).length;count.textContent=rows.length+' shown';viewLabel.textContent=({players:'YAHOO PLAYERS',targets:'MY TARGETS',cowbell:'COWBELLS',injuries:'INJURY WATCH',intel:'INTEL'})[view];empty.hidden=rows.length>0;cards.innerHTML=rows.map(card).join('')}function card(p){let tags=[`TIER ${tier(p)||'—'}`,...(p.intel_tags||[])];if(p.intel_action)tags.push(p.intel_action);if(p.user_target)tags.push('TARGET');let notes=[];if(p.intel_recommendation)notes.push('<strong>Our action:</strong> '+esc(p.intel_recommendation));if(p.user_note)notes.push('<strong>Your note:</strong> '+esc(p.user_note));if((p.suggestions||[]).length)notes.push('<div class="suggest"><strong>Research notes:</strong> '+p.suggestions.slice(0,4).map(x=>esc((x.sentiment||'')+': '+x.note)).join(' · ')+'</div>');return`<article class="card"><div class="row"><div class="rank"><small>YAHOO</small>#${p.yahoo_rank??'—'}</div><div><div class="name">${esc(p.yahoo_name)} <span class="verify">YAHOO ✓</span></div><div class="meta">${esc(p.team)} · ${esc(p.position)}</div><div class="badges">${tags.map(t=>`<span class="badge ${String(t).toLowerCase().replace(/[^a-z]+/g,'')}">${esc(t)}</span>`).join('')}</div></div><button class="star ${p.user_target?'on':''}" onclick="toggleTarget('${js(p.player_key)}',${!p.user_target})">${p.user_target?'★':'☆'}</button></div>${notes.length?`<div class="notes">${notes.join('')}</div>`:''}</article>`}async function toggleTarget(k,v){const t=localStorage.getItem('fantasyBoardToken');if(!t){openToken();return}const r=await fetch(SB+'/rest/v1/rpc/mobile_set_target',{method:'POST',headers:H,body:JSON.stringify({p_token:t,p_player_key:k,p_target:v})});if(!r.ok){alert('Target update failed');return}const p=all.find(x=>x.player_key===k);if(p)p.user_target=v;render()}function openToken(){token.value=localStorage.getItem('fantasyBoardToken')||'';modal.classList.add('open')}function closeToken(){modal.classList.remove('open')}function saveToken(){if(token.value.trim())localStorage.setItem('fantasyBoardToken',token.value.trim());closeToken()}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function js(v){return String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}load();setInterval(load,30000);</script></body></html>
