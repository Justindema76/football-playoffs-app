<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fantasy Football 2026">
  <title>Fantasy Football 2026</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app" id="app" data-view="draft">
    <header class="topbar">
      <div class="topline">
        <div class="brand">
          <h1>Fantasy Football 2026</h1>
          <div class="sub">Yahoo ranking order + live fantasy intelligence</div>
        </div>

        <label class="search-wrap" aria-label="Search">
          <input id="search" class="search" type="search" placeholder="Search player, team, action..." autocomplete="off">
        </label>

        <div class="header-actions">
          <button id="keyButton" class="key-button" type="button" aria-label="Set app key">KEY</button>
          <div id="syncPill" class="status-pill" data-state="loading">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="sync">SYNCING</span>
          </div>
        </div>
      </div>

      <div class="stats" aria-label="Fantasy summary">
        <div class="stat"><b id="intelCount">—</b><span>INTEL</span></div>
        <div class="stat"><b id="highCount">—</b><span>HIGH+</span></div>
        <div class="stat"><b id="flagCount">—</b><span>FLAGGED</span></div>
        <div class="stat"><b id="targetCount">—</b><span>PLAN PLAYERS</span></div>
      </div>
    </header>

    <section class="viewbar">
      <div>
        <h2 id="viewTitle">DRAFT</h2>
        <div id="positionLegend" class="position-legend" aria-label="Position colors">
          <span class="position-badge QB">QB</span>
          <span class="position-badge RB">RB</span>
          <span class="position-badge WR">WR</span>
          <span class="position-badge TE">TE</span>
          <span class="position-badge DEF">DEF</span>
          <span class="position-badge K">K</span>
        </div>
      </div>
      <div id="viewMeta" class="view-meta"></div>
    </section>

    <div id="filters" class="filters" aria-label="Position filters"></div>
    <div id="notice" class="notice" hidden></div>
    <main id="content" class="content" aria-live="polite"></main>
  </div>

  <nav class="bottom-nav" aria-label="Fantasy views">
    <div class="nav-inner">
      <button type="button" data-view="intel">INTEL</button>
      <button type="button" data-view="players">PLAYERS</button>
      <button type="button" data-view="targets">TARGETS</button>
      <button type="button" data-view="cowbell">COWBELL</button>
      <button type="button" data-view="injuries">INJURIES</button>
      <button type="button" data-view="weather">WEATHER</button>
      <button type="button" data-view="draft" class="active">DRAFT</button>
    </div>
  </nav>

  <div id="keyModal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="keyTitle">
      <h3 id="keyTitle">App key</h3>
      <p>Enter the Fantasy Football 2026 app key. It is saved on this device.</p>
      <input id="keyInput" type="password" inputmode="numeric" autocomplete="off" placeholder="App key">
      <div class="modal-actions">
        <button type="button" class="button secondary" data-close-modal>Cancel</button>
        <button type="button" class="button primary" id="saveKeyButton">Save</button>
      </div>
    </section>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
