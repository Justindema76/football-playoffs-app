<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <title>Fantasy Football 2026</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell" id="shell" data-view="draft">
    <header class="app-header">
      <div class="header-main">
        <div class="brand-wrap">
          <h1>Fantasy Football 2026</h1>
          <p>Yahoo Player List + your draft intelligence</p>
        </div>
        <input id="search" class="search" type="search" placeholder="Search player, team, position..." autocomplete="off">
        <div class="header-actions">
          <button id="keyButton" class="ghost-btn" type="button">KEY</button>
          <span id="syncPill" class="sync-pill" data-state="loading"><i></i><b id="syncText">SYNCING</b></span>
        </div>
      </div>
      <div class="summary-grid">
        <div><b id="yahooCount">—</b><span>YAHOO PLAYERS</span></div>
        <div><b id="targetCount">—</b><span>TARGETS</span></div>
        <div><b id="intelCount">—</b><span>INTEL</span></div>
        <div><b id="flagCount">—</b><span>FLAGGED</span></div>
      </div>
    </header>

    <section class="page-head">
      <div>
        <h2 id="pageTitle">DRAFT</h2>
        <div id="positionFilters" class="filter-row"></div>
      </div>
      <div id="pageMeta" class="page-meta"></div>
    </section>

    <div id="notice" class="notice" hidden></div>
    <main id="content"></main>
  </div>

  <nav class="bottom-nav">
    <button data-view="intel">INTEL</button>
    <button data-view="players">PLAYERS</button>
    <button data-view="targets">TARGETS</button>
    <button data-view="cowbell">COWBELL</button>
    <button data-view="injuries">INJURIES</button>
    <button data-view="weather">WEATHER</button>
    <button data-view="draft" class="active">DRAFT</button>
  </nav>

  <div id="keyModal" class="modal" hidden>
    <div class="shade" data-close-key></div>
    <section class="dialog">
      <h3>App key</h3>
      <p>Enter the six-digit app key once. It stays on this device.</p>
      <input id="keyInput" type="password" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]{6}" placeholder="6-digit app key">
      <div class="dialog-actions"><button class="secondary" data-close-key>Cancel</button><button class="primary" id="saveKey">Save</button></div>
    </section>
  </div>

  <div id="manualModal" class="modal" hidden>
    <div class="shade" data-close-manual></div>
    <section class="dialog">
      <h3>Add missing Yahoo player</h3>
      <p>Use the exact Yahoo name, team, position and Pre-Season rank.</p>
      <div class="form-grid">
        <label class="wide"><span>Name</span><input id="mName" placeholder="Player name"></label>
        <label><span>Team</span><input id="mTeam" maxlength="4" placeholder="BUF"></label>
        <label><span>Position</span><select id="mPos"><option>QB</option><option>RB</option><option>WR</option><option>TE</option><option>K</option><option>DEF</option></select></label>
        <label><span>Yahoo rank</span><input id="mRank" type="number" min="1" inputmode="numeric" placeholder="31"></label>
      </div>
      <div class="dialog-actions"><button class="secondary" data-close-manual>Cancel</button><button class="primary" id="saveManual">Add + Target</button></div>
    </section>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
