<!doctype html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <title>Fantasy Football 2026 · My Team</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="feature-panels.css">
  <link rel="stylesheet" href="mobile-nav.css">
  <link rel="stylesheet" href="season.css">
</head>
<body>
  <div class="shell" id="shell" data-view="team">
    <header class="app-header">
      <div class="header-main">
        <div class="brand-wrap"><h1>2026 Fantasy Intel</h1><p>Your live roster + in-season intelligence</p></div>
        <input id="search" class="search" type="search" placeholder="Search roster, player, team, injury..." autocomplete="off">
        <div class="header-actions">
          <a class="ghost-btn" href="league.html" style="text-decoration:none;display:inline-flex;align-items:center">LEAGUE</a>
          <button id="themeButton" class="theme-btn" type="button" aria-label="Toggle light and dark mode" onclick="document.documentElement.classList.toggle('light');this.textContent=document.documentElement.classList.contains('light')?'🌙':'☀️'">🌙</button>
          <button id="keyButton" class="ghost-btn" type="button">KEY</button>
          <span id="syncPill" class="sync-pill" data-state="loading"><i></i><b id="syncText">SYNCING</b></span>
        </div>
      </div>
      <div class="summary-grid">
        <div><b id="rosterCount">—</b><span>ROSTER</span></div>
        <div><b id="starterCount">—</b><span>STARTERS</span></div>
        <div><b id="intelCount">—</b><span>INTEL</span></div>
        <div><b id="flagCount">—</b><span>FLAGGED</span></div>
      </div>
    </header>
    <section class="page-head"><div><h2 id="pageTitle">MY TEAM</h2><div id="positionFilters" class="filter-row"></div></div><div id="pageMeta" class="page-meta"></div></section>
    <div id="notice" class="notice" hidden></div>
    <main id="content"></main>
  </div>

  <nav class="bottom-nav">
    <button data-view="team" class="active">MY TEAM</button>
    <button data-view="intel">INTEL</button>
    <button data-view="players">PLAYERS</button>
    <button data-view="runningbacks">RUNNING BACKS</button>
    <button data-view="widereceivers">WIDE RECEIVERS</button>
    <button data-view="injuries">INJURIES</button>
    <button data-view="weather">WEATHER</button>
    <button type="button" onclick="location.href='league.html'">LEAGUE</button>
  </nav>

  <div id="keyModal" class="modal" hidden><div class="shade" data-close-key></div><section class="dialog"><h3>App key</h3><p>Enter the six-digit app key once. It stays on this device.</p><input id="keyInput" type="password" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]{6}" placeholder="6-digit app key"><div class="dialog-actions"><button class="secondary" data-close-key>Cancel</button><button class="primary" id="saveKey">Save</button></div></section></div>

  <script src="Players.js" defer></script>
  <script src="Intel.js" defer></script>
  <script src="RunningBacks.js" defer></script>
  <script src="WideReceivers.js" defer></script>
  <script src="season-app.js" defer></script>
  <script src="mobile-nav.js" defer></script>
</body>
</html>
