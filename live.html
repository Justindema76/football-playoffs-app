<!doctype html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <title>Fantasy Football 2026 — Live Draft</title>
  <link rel="stylesheet" href="live.css">
</head>
<body>
  <div class="live-toolbar-wrap">
    <header class="live-header">
      <div class="brand">
        <h1>LIVE DRAFT</h1>
        <p>Yahoo extension feed — separate from your master board</p>
      </div>
      <div class="status-wrap">
        <span id="syncStatus" class="status syncing">SYNCING</span>
        <a class="master-link" href="/">MASTER</a>
      </div>
    </header>

    <section class="summary">
      <div class="stat"><b id="availableCount">—</b><span>AVAILABLE</span></div>
      <div class="stat"><b id="goneCount">—</b><span>GONE</span></div>
      <div class="stat"><b id="starCount">—</b><span>STARRED LEFT</span></div>
      <div class="stat"><b id="lastUpdate">—</b><span>LAST CHANGE</span></div>
    </section>

    <section class="controls">
      <input id="search" type="search" placeholder="Search player, team, position..." autocomplete="off">
      <div class="segmented" role="tablist">
        <button class="active" data-view="starred">STARRED</button>
        <button data-view="all">ALL</button>
        <button data-view="gone">GONE</button>
        <button id="mineTab" data-view="mine" hidden>MINE</button>
      </div>
      <div class="sort-wrap">
        <label for="sortBy" class="sort-label">SORT</label>
        <select id="sortBy">
          <option value="rank">Yahoo Rank</option>
          <option value="name">Name (A–Z)</option>
          <option value="pos">Position</option>
          <option value="team">Team</option>
        </select>
        <button id="sortDir" class="sort-dir" title="Toggle ascending/descending" aria-label="Toggle sort direction">↑</button>
      </div>
      <button id="refresh" class="refresh">REFRESH</button>
      <button id="reset" class="reset">RESET</button>
    </section>

    <p id="roomTag" class="room-tag" hidden></p>
    <section id="notice" class="notice" hidden></section>
  </div>

  <main class="live-shell">
    <section id="players" class="players"></section>
  </main>
  <script src="live.js" defer></script>
</body>
</html>
