<!doctype html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <title>Fantasy Football 2026 — Live Draft</title>
  <link rel="stylesheet" href="live.css">
  <link rel="stylesheet" href="mobile-nav.css">
</head>
<body>
  <main class="live-shell">
    <header class="live-header">
      <div>
        <h1>LIVE DRAFT</h1>
        <p>Yahoo extension feed — separate from your master board</p>
      </div>
      <div class="status-wrap">
        <span id="syncStatus" class="status syncing">SYNCING</span>
        <a class="master-link" href="index.html">MASTER</a>
        <a class="master-link" href="strategy.html">STUDY</a>
      </div>
    </header>

    <section class="summary">
      <div><b id="availableCount">—</b><span>AVAILABLE</span></div>
      <div><b id="goneCount">—</b><span>GONE</span></div>
      <div><b id="starCount">—</b><span>STARRED LEFT</span></div>
      <div><b id="lastUpdate">—</b><span>LAST CHANGE</span></div>
    </section>

    <section class="controls">
      <input id="search" type="search" placeholder="Search player..." autocomplete="off">
      <div class="segmented">
        <button class="active" data-view="starred">STARRED</button>
        <button data-view="all">ALL</button>
        <button data-view="gone">GONE</button>
        <button id="mineTab" data-view="mine" hidden>MINE</button>
      </div>
      <button id="refresh" class="refresh">REFRESH</button>
      <button id="reset" class="reset">RESET</button>
    </section>

    <section id="notice" class="notice" hidden></section>
    <section id="players" class="players"></section>
  </main>
  <script src="live.js" defer></script>
  <script src="mobile-nav.js" defer></script>
</body>
</html>
