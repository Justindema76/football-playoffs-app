<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>Fantasy Live Sync</title></head>
<body>
  <main>
    <h1>Fantasy Live Sync</h1>
    <p id="status">Checking Yahoo draft…</p>
    <div class="count"><b id="count">0</b><span>drafted synced</span></div>
    <button id="scan">SCAN NOW</button>
    <button id="open" class="secondary">OPEN LIVE VIEW</button>
    <small>This extension reads the Yahoo draft page already open in your browser. It does not poll Yahoo in the background.</small>
  </main>
  <script src="popup.js"></script>
</body>
</html>
