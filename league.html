<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Fantasy Football 2026 · League</title>
  <link rel="stylesheet" href="league.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <a class="back" href="/">← MY TEAM</a>
        <p class="eyebrow">2026 FANTASY INTEL</p>
        <h1>Battle of the Kings</h1>
        <p class="sub">Yahoo League 497223 · complete league ownership view</p>
      </div>
      <div class="top-actions">
        <button id="refreshButton" type="button">REFRESH</button>
        <button id="themeButton" type="button" aria-label="Toggle theme">☀️</button>
      </div>
    </header>

    <section class="summary" aria-label="League summary">
      <div><b id="teamCount">—</b><span>TEAMS</span></div>
      <div><b id="rosterCount">—</b><span>ROSTERED</span></div>
      <div><b id="matchedCount">—</b><span>MATCHED</span></div>
      <div><b id="unmatchedCount">—</b><span>UNMATCHED</span></div>
    </section>

    <section class="controls">
      <input id="search" type="search" placeholder="Search team, player, NFL team, position..." autocomplete="off">
      <div class="sync-read"><span id="syncDot"></span><b id="syncLabel">LOADING</b><small id="syncTime"></small></div>
    </section>

    <div id="notice" class="notice" hidden></div>
    <main id="teams" class="team-grid" aria-live="polite"></main>
  </div>
  <script src="league.js" defer></script>
</body>
</html>
